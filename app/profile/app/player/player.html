<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <script src="https://stpamitkumar.00webhostapp.com/fa_fa_icon_5_pro/icon.js"></script>

    <link rel="stylesheet" href="css/player.css">

    <link rel="stylesheet" type="text/css" href="bootstrap/bootstrap.min.css">

    <script src="bootstrap/bootstrap.min.js"></script>

</head>

<body>



    <div id="left">

        <video id="vedio_player" style="width:100%; height:85vh">

            <source id="vedio_src" src=" two.mp4" >
            </source>

        </video>

        <div id="progress_box">

            <div id="progress_bar"></div>

        </div>

        <div id="control">

            <div id="timing">

                <p id="v_timing">00:00/00:00</p>

            </div>

            <div id="play_tools">

                <p>
                    <img src="images/back.png" alt="" id="previous">
                </p>

                <h1 id="play" class="playin" id="b">
                    <img src="images/ply.png" alt="">
                </h1>

                <h1 class="pause" id="pause" color="red">
                    <img src="images/p_m.png" alt="">
                </h1>

                <p>
                    <img src="images/forward.png" alt="" id="next">
                </p>





            </div>

            <div id="other_tools">

                <div id="vol_box">

                    <input type="range" min="0" max="1" step="0.01" id="v" style="display:none;">

                    <img src="images/screenn.png" alt="" id="v_i">



                </div>

                <div id="speed_box">

                    <input type="range" min="0.5" max="2" step="0.25" id="s" style="display:none;">

                    <img src="images/setting.png" alt="" id="s_i">



                </div>



                <img src="images/volumee.png" alt="" id="full_screen">

            </div>

        </div>

    </div>

    <div id="right">

        <div id="topi">

            <h3>Playlist</h3>

            <input type="search" placeholder="Search your videos Here..." id="search" class="form-control">

            <p id="open_vedio_box_btn" color="yellow">➕</p>

            <p id="close_vedio_box_btn">✖</p>

            <div id="add_vedio_box" class="bg-danger ">

                <h2>Add Videos</h2>

                <form>

                    <input type="text" name="" id="vedio_name" placeholder="Enter Your Video Name..."
                        class="form-control">

                    <input type="text" placeholder="Enter Your Vedio URL.." id="vedio_link" class="form-control">

                    <button type="submit" id="add_vedio_btn" class="btn ">Add</button>

            </div>

        </div>

        <div id="bottomi">



        </div>

    </div>

    </div>

    <script src="js/player.js"></script>

</body>

</html>
