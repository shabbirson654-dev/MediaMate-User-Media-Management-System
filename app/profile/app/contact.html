<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

   <link rel="stylesheet" href="animate/animate.css">

    <link rel="stylesheet" href="css/contact.css">

</head>
<style>
    body{

        background-color:rgba(255,255,128,0.9);
    }
</style>

<body>

  

    <div id="profile_box">

       

        <div id="profile_pic"></div>



    </div>

   <img src="images/new3.png" alt="" id="new_contact" width="30">



    

   <div id="main_all_contactbox">

       <div id="contact_header">

           

        <h1> 👦All Contact</h1>

        <input type="search" placeholder="Search your contact here" id="search">

       </div>

       <div id="all_contact_box">

        

       

   </div>

   <div id="contact_bg" class="animate__animated animate__fadeIn">

      <center>

       <div id="add_contact_box" class="animate__animated animate__slideInDown">

           <h1 id="c_heading">Add New Contact</h1>

           <form >

               <input type="text" name="" id="c_name" placeholder="Enter Name">

               <input type="number" name="" id="c_num" placeholder="Enter phone number">

               <button type="submit" id="add">Add</button>

               <button type="button" id="close">Close</button>

           </form>

       

       </div>

    </center>

   </div>



    <script src="js/contact.js"></script>

</body>

</html>
