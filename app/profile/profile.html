<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <link rel="stylesheet" href="css/profile.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="

<style>
    * {
        background-color: rgba(255, 255, 128, 0.9);

<body>

    <div id="container">

        <div id="page_cover">

            <div id="profile_box">

                <div id="profile_pic">



                    <input type="file" accept="images/*" id="profile_upload">



                </div>

                <p id="line">Upload Profile Pic</p>

                <h1 id="profile_name"></h1>

                <button id="next">Next ⏩</button>

            </div>

        </div>

    </div>



    <div id="main_profile_page">

        <div id="profile_header">

            <div id="profile_picture"></div>

        </div>

        <h1 id="profile_username"></h1>

        <a href="app/contact.html">

            <div id="app">

                <div id="contact">

                    <img src="images/contact.png" alt="">

                    <p>Contact</p>

                </div>

        </a>

        <a href="app/player/player.html">

            <div id="player">

                <img src="images/user.png" alt="">

                <p>Player</p>

        </a>

    </div>

    <div id="logout">

        <img src="images/logout.png" alt="">

        <p id="logout_text">Logout</p>

    </div>



    </div>

    <div id="profile_footer">

        <p>Developed By : Shabbir Son's</p>

    </div>

    </div>





    <script src="js/profile.js"></script>
