<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css">
    <script src="bootstrap/bootstrap.min.js"></script>
</head>
<style>
    #main_profile_page {
        background-color: rgba(255, 255, 128, 0.9);
    }

    #profile_footer,
    #contact,
    #player,
    #logout {
        background-color: rgba(255, 255, 0, 0.9);
        color: #ccc;
    }

    #profile_username {
        color: #ccc;
    }
</style>

<body>
    <div id="container">

        <div id="page_cover">

            <div id="profile_box">

                <div id="profile_pic">



                    <input type="file" accept="images/*" id="profile_upload">



                </div>

                <p id="line">Upload Profile Pic</p>

                <h1 id="profile_name"></h1>

                <button id="next">Next </button>

            </div>

        </div>

    </div>



    <div id="main_profile_page">
        <div style="box-shadow: 0px 0px 10px #ccc;">
            <div id="profile_header">

                <div id="profile_picture"></div>

            </div>

            <h1 id="profile_username"></h1>
        </div>
        <a href="app/contact.html" class="nav-link">

            <div id="app">

                <div id="contact">

                    <img src="images/contact1.png" alt="" width="65">

                    <p>Contact</p>

                </div>

        </a>

        <a href="app/player/player.html" class="nav-link">

            <div id="player">

                <img src="images/user1.png" alt="" width="65">

                <p style="color:#ccc; outline:none; border:none;">Player</p>

        </a>

    </div>

    <div id="logout">

        <img src="images/logout1.png" alt="" width="65">

        <p id="logout_text">Logout</p>

    </div>



    </div>

    <div id="profile_footer">

        <p>Developed By : Shabbir Son's</p>

    </div>

    </div>





    <script src="js/profile.js"></script>

</body>

</html>
</body>

</html>
